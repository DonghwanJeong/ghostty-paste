name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build universal .app zip
        run: make release

      - name: Inspect
        run: |
          lipo -info .build/ghostty-paste.app/Contents/MacOS/ghostty-paste
          codesign -dv --verbose=2 .build/ghostty-paste.app

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: .build/ghostty-paste.app.zip
          generate_release_notes: true
